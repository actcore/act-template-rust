_min_copier_version: "9.4.0"
_subdirectory: template
_templates_suffix: .jinja
_skip_if_exists:
  - src/lib.rs
  - "e2e/*.hurl"
  - .gitignore
  - act.toml
  - "skill/*"

project_name:
  type: str
  help: Component name (e.g. my-tool)

description:
  type: str
  help: Component description

component_ref:
  type: str
  help: >-
    OCI reference to publish this component to (registry/namespace/name, no tag).
    Override at publish time with the OCI_REF env var.
  default: "actpkg.dev/library/{{ project_name }}"

needs_http:
  type: bool
  default: false
  help: Does this component need outbound HTTP/HTTPS access?

needs_filesystem:
  type: bool
  default: false
  help: Does this component need filesystem access?

needs_sockets:
  type: bool
  default: false
  help: Does this component need raw TCP/UDP socket access (e.g. a database client)?
